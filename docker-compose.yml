version: '3.8'

services:
  diu-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diu_cgpa_backend
    restart: always
    ports:
      # Loopback only: the Cloudflare Tunnel on this VM reaches it, the internet cannot (plain HTTP
      # here would expose student passwords). Set BACKEND_BIND=0.0.0.0 only behind your own TLS proxy.
      - "${BACKEND_BIND:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    volumes:
      # Fallback database storage
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
